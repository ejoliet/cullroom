# Cullroom Workflow Multi File Feature Update

## Action

Follow the multi-file-feature-update workflow:
1. Edit host.html to update UI or logic for hosts.
2. Edit client.html to update UI or logic for clients.
3. Edit keygen.js to update backend or cryptographic logic.
4. Edit README.md to clarify usage or document changes.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: host.html, client.html, keygen.js

